<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Budget Umroh</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d9488">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            color: #0d9488;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0d9488;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .total-box {
            background: #f0fdfa;
            border: 1px solid #ccfbf1;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }
        .total-box .label {
            font-size: 0.85rem;
            color: #0f766e;
            font-weight: 600;
        }
        .total-box .amount {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0d9488;
            margin-top: 4px;
        }
        button.btn-ai {
            width: 100%;
            background: #0d9488;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-ai:hover {
            background: #0f766e;
        }
        button.btn-ai:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .ai-result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            display: none;
        }
        .loading {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #64748b;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kalkulator Budget Umroh</h1>

    <div class="grid-2">
        <div class="form-group">
            <label>Jumlah Jamaah (Orang)</label>
            <input type="number" id="jamaah" value="1" min="1" oninput="calculate()">
        </div>
        <div class="form-group">
            <label>Durasi (Hari)</label>
            <input type="number" id="durasi" value="9" min="1" oninput="calculate()">
        </div>
    </div>

    <div class="form-group">
        <label>Tiket Pesawat PP (per Orang)</label>
        <input type="text" class="rupiah" id="tiket" value="13.500.000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label>Visa + Asuransi (per Orang)</label>
        <input type="text" class="rupiah" id="visa" value="3.500.000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label>Hotel Makkah (per Malam/Kamar)</label>
        <input type="text" class="rupiah" id="hotel_makkah" value="1.200.000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label>Hotel Madinah (per Malam/Kamar)</label>
        <input type="text" class="rupiah" id="hotel_madinah" value="1.000.000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label>Makan & Minum (per Hari/Orang)</label>
        <input type="text" class="rupiah" id="makan" value="250.000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label>Transportasi Bus / Kereta Cepat (per Orang)</label>
        <input type="text" class="rupiah" id="transport" value="1.500.000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label>Biaya Tak Terduga / Oleh-oleh</label>
        <input type="text" class="rupiah" id="lainnya" value="2.000.000" oninput="calculate()">
    </div>

    <div class="total-box">
        <div class="label">ESTIMASI TOTAL BIAYA</div>
        <div class="amount" id="total_display">Rp 0</div>
    </div>

    <button class="btn-ai" id="btn-ai" onclick="analyzeAI()">✨ Analisis Anggaran dengan AI</button>
    <div class="loading" id="loading">Sedang menganalisis anggaran dengan Gemini...</div>
    <div class="ai-result" id="ai-result"></div>
</div>

<script>
    // Format Pemisah Ribuan (Ribuan Otomatis)
    document.querySelectorAll('.rupiah').forEach(input => {
        input.addEventListener('keyup', function(e) {
            let value = this.value.replace(/[^0-9]/g, '');
            this.value = value ? parseInt(value, 10).toLocaleString('id-ID') : '';
            calculate();
        });
    });

    function parseVal(id) {
        let el = document.getElementById(id);
        if (!el) return 0;
        let clean = el.value.toString().replace(/[^0-9]/g, '');
        return clean ? parseInt(clean, 10) : 0;
    }

    function calculate() {
        let j = parseVal('jamaah') || 1;
        let d = parseVal('durasi') || 1;
        let tiket = parseVal('tiket') * j;
        let visa = parseVal('visa') * j;
        
        // Estimasi pembagian durasi hotel
        let malamMakkah = Math.ceil(d / 2);
        let malamMadinah = Math.floor(d / 2);
        let kamar = Math.ceil(j / 2); // 1 kamar untuk 2 orang
        
        let hotelMakkah = parseVal('hotel_makkah') * malamMakkah * kamar;
        let hotelMadinah = parseVal('hotel_madinah') * malamMadinah * kamar;
        let makan = parseVal('makan') * d * j;
        let transport = parseVal('transport') * j;
        let lainnya = parseVal('lainnya') * j;

        let total = tiket + visa + hotelMakkah + hotelMadinah + makan + transport + lainnya;
        document.getElementById('total_display').innerText = 'Rp ' + total.toLocaleString('id-ID');
        return { j, d, tiket, visa, hotelMakkah, hotelMadinah, makan, transport, lainnya, total };
    }

    calculate();

    async function analyzeAI() {
        let data = calculate();
        let btn = document.getElementById('btn-ai');
        let loading = document.getElementById('loading');
        let resDiv = document.getElementById('ai-result');

        btn.disabled = true;
        loading.style.display = 'block';
        resDiv.style.display = 'none';

        let prompt = `Sebagai konsultan travel Umroh profesional, berikan analisis singkat dan saran efisiensi untuk rancangan anggaran berikut:
- Jumlah Jamaah: ${data.j} orang
- Durasi: ${data.d} hari
- Total Tiket Pesawat: Rp ${data.tiket.toLocaleString('id-ID')}
- Total Visa & Asuransi: Rp ${data.visa.toLocaleString('id-ID')}
- Total Akomodasi Hotel: Rp ${(data.hotelMakkah + data.hotelMadinah).toLocaleString('id-ID')}
- Total Konsumsi: Rp ${data.makan.toLocaleString('id-ID')}
- Transportasi Lokal: Rp ${data.transport.toLocaleString('id-ID')}
- Biaya Lain-lain: Rp ${data.lainnya.toLocaleString('id-ID')}
- ESTIMASI TOTAL KESELURUHAN: Rp ${data.total.toLocaleString('id-ID')}

Berikan penilaian apakah rancangan budget ini realistis, komponen apa yang paling menyerap biaya, dan 2-3 tips hemat yang aman. Buat ringkas dan terstruktur.`;

        try {
            let res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });
            let result = await res.json();
            if (result.error) {
                resDiv.innerText = "Gagal memproses AI: " + result.error;
            } else {
                resDiv.innerText = result.reply;
            }
        } catch (err) {
            resDiv.innerText = "Terjadi kendala jaringan: " + err.message;
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
            resDiv.style.display = 'block';
        }
    }

    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
</script>
</body>
</html>
